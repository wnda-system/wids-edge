# Reboot by itself instead of staying frozen. This sensor machine hard-froze
# repeatedly on 2026-10-09 (rtw88 WiFi driver suspected) and only came back
# when someone pressed the power button.
#
# Installed as /etc/sysctl.d/90-autoreboot-on-hang.conf (see ops/README.md).
# Undo: sudo rm /etc/sysctl.d/90-autoreboot-on-hang.conf && reboot

# Treat a CPU stuck in kernel mode (soft lockup, ~20 s) as fatal
kernel.softlockup_panic = 1
# Same for a CPU stuck with interrupts off (NMI watchdog, hard lockup)
kernel.hardlockup_panic = 1
# A task blocked in the kernel for 120 s (e.g. a wedged driver) is fatal too
kernel.hung_task_panic = 1
kernel.hung_task_timeout_secs = 120
# On any panic or oops: reboot 10 s later
kernel.panic_on_oops = 1
kernel.panic = 10
